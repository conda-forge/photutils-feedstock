{% set version = "3.1.1" %}

package:
  name: photutils-base
  version: {{ version }}

source:
  url: https://files.pythonhosted.org/packages/source/p/photutils/photutils-{{ version }}.tar.gz
  sha256: 32ea59ea38ed910374f7d75a5498b90ef1c5e839c2804f44f25fa024587f0506

build:
  number: 0
  skip: true  # [py<312]

requirements:
  build:
    - python                                 # [build_platform != target_platform]
    - cross-python_{{ target_platform }}     # [build_platform != target_platform]
    - cython >=3.1.2,<4                      # [build_platform != target_platform]
    - numpy                                  # [build_platform != target_platform]
    - {{ compiler("c") }}
    - {{ stdlib("c") }}
  host:
    - python
    - pip
    - astropy-base >=7.0
    - cython >=3.1.2,<4
    - extension-helpers >=1.4,<2
    - numpy
    - scipy >=1.15
    - setuptools >=77.0.1
    - setuptools_scm >=8.2
  run:
    - python
    - astropy-base >=7.0
    - numpy >=2.0
    - scipy >=1.15

test:
  requires:
    - pytest-astropy
  imports:
    - photutils
    - photutils.aperture
    - photutils.background
    - photutils.centroids
    - photutils.converters
    - photutils.datasets
    - photutils.detection
    - photutils.geometry
    - photutils.isophote
    - photutils.morphology
    - photutils.profiles
    - photutils.psf
    - photutils.psf_matching
    - photutils.resources
    - photutils.segmentation
    - photutils.utils

outputs:
  - name: photutils-base
    build:
      script: {{ PYTHON }} -m pip install . -vv

# build this exactly once, on the oldest supported python, to avoid migration issues
  - name: photutils
    build:
      noarch: python
      skip: true  # [not (linux64 and py==312)]
    requirements:
      host:
        - python {{ python_min }}
      run:
        - python >={{ python_min }}
        - asdf >=3.3
        - asdf-astropy >=0.10
        - bottleneck >=1.4
        - gwcs >=0.22
        - matplotlib-base >=3.10
        - rasterio >=1.4
        - regions >=0.10
        - shapely >=2.1
        - tqdm >=4.67
        - {{ pin_subpackage('photutils-base', max_pin="x.x.x") }}
    test:
      requires:
        - python {{ python_min }}
        - pytest-astropy
      imports:
        - photutils
        - photutils.aperture
        - photutils.background
        - photutils.centroids
        - photutils.datasets
        - photutils.detection
        - photutils.geometry
        - photutils.isophote
        - photutils.morphology
        - photutils.profiles
        - photutils.psf
        - photutils.psf.matching
        - photutils.segmentation
        - photutils.utils

about:
  home: https://photutils.readthedocs.io/
  license: BSD-3-Clause
  license_family: BSD
  license_file: LICENSE.rst
  summary: An Astropy package for photometry
  description: |
    Photutils is an Astropy package for detection and photometry of
    astronomical sources.
  doc_url: https://photutils.readthedocs.io/
  dev_url: https://github.com/astropy/photutils

extra:
  feedstock-name: photutils
  recipe-maintainers:
    - larrybradley
    - bsipocz
    - mwcraig
